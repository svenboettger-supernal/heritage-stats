<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Heritage 2027 Statistics</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&family=Public+Sans:wght@400;500;600&display=swap">
<style>
:root{--bg:#f5f6f3;--paper:#fdfdfb;--ink:#161d19;--muted:#5f6a64;--line:#d5dad4;--line-strong:#b6bfb8;--accent:#1e4b3a;--accent-ink:#f3f7f4;--accent-soft:#e2ece6;--warn:#9a6b12;--warn-soft:#f6ecd3;--bad:#9b3b2e;--display:"Source Serif 4",Georgia,serif;--body:"Public Sans",system-ui,sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#131816;--paper:#1a211d;--ink:#edf1ee;--muted:#9aa69f;--line:#2d3732;--line-strong:#43504a;--accent:#8fcaa9;--accent-ink:#10201a;--accent-soft:#1f3329;--warn:#e2b45a;--warn-soft:#3a2f14;--bad:#e58a7c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#131816;--paper:#1a211d;--ink:#edf1ee;--muted:#9aa69f;--line:#2d3732;--line-strong:#43504a;--accent:#8fcaa9;--accent-ink:#10201a;--accent-soft:#1f3329;--warn:#e2b45a;--warn-soft:#3a2f14;--bad:#e58a7c;color-scheme:dark}
*{box-sizing:border-box}[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;padding:24px 16px 56px;margin:0}
main{max-width:1040px;margin:0 auto;display:grid;gap:22px}
h1{font-family:var(--display);font-weight:500;font-size:clamp(26px,4vw,36px);margin:0;line-height:1.1}h2{font-family:var(--display);font-weight:500;font-size:21px;margin:0}
.sub{color:var(--muted);margin:0}
header{display:flex;flex-wrap:wrap;gap:12px 24px;justify-content:space-between;align-items:flex-start}
.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
button,input{font:inherit;color:inherit}
.btn{padding:8px 14px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:4px;font-weight:500;cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent)}.btn:disabled{opacity:.6;cursor:wait}
label.auto{font-size:13px;color:var(--muted);display:inline-flex;gap:6px;align-items:center}
.key{background:var(--paper);border:1px solid var(--line);border-left:4px solid var(--warn);padding:14px 18px;display:grid;gap:8px}
.key input{padding:8px 10px;border:1px solid var(--line-strong);background:var(--bg);border-radius:4px;width:min(420px,100%);font-family:ui-monospace,Menlo,monospace}
.err{color:var(--bad)}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}.kpis div{background:var(--accent-soft);padding:12px 14px;display:grid;gap:2px}
.kpis .k{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}.kpis .v{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
section{background:var(--paper);border:1px solid var(--line);padding:16px 18px;display:grid;gap:10px}.wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums;min-width:640px}th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}td.r,th.r{text-align:right}.mono{font-family:ui-monospace,Menlo,monospace;font-size:12px}
.ev{display:inline-block;padding:1px 7px;border-radius:3px;font-size:12px;font-weight:500;background:var(--bg);border:1px solid var(--line)}.ev.print{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}.ev.select{background:var(--warn-soft);color:var(--warn);border-color:var(--warn-soft)}
.empty{color:var(--muted)}
@media (max-width:640px){.kpis{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<main>
  <header>
    <div><h1>Heritage 2027 page: statistics</h1><p class="sub" id="sub">Live from the event log.</p></div>
    <div class="actions"><button type="button" class="btn" id="refresh">Refresh</button><label class="auto"><input type="checkbox" id="auto" checked> every minute</label><button type="button" class="btn ghost" id="forget" hidden>Forget key</button></div>
  </header>
  <div class="key" id="keybox" hidden>
    <b>Read key</b>
    <span class="sub">Paste the statistics read key once. It stays in this browser only.</span>
    <div class="actions"><input type="password" id="key" autocomplete="off" placeholder="read key"><button type="button" class="btn" id="save">Save and load</button></div>
    <span class="err" id="err" hidden></span>
  </div>
  <div class="kpis" id="kpis"></div>
  <section><h2>Proposals printed</h2><div class="wrap"><table id="prints"></table></div></section>
  <section><h2>Visitors</h2><p class="sub">A browser is one visitor device, not a person.</p><div class="wrap"><table id="sessions"></table></div></section>
  <section><h2>Event log</h2><p class="sub">Newest first, last 300. Crawler hits and direct GitHub hits are left out.</p><div class="wrap"><table id="log"></table></div></section>
</main>
<script>
(function(){
  const URL_="https://cjszlbleajvvdgeyibir.supabase.co/rest/v1/rpc/artifact_events_read", KEY="sb_publishable_TkFE7VzQABaz1wxqGF-joQ_WAcmERFQ", ARTIFACT="heritage-2027-order-form";
  const LINES={maintenance:"Maintenance",dpe:"DPE",development:"Feature requests",helpdesk:"Help Desk",foreman:"Foreman",growth:"Growth Pod"}, LOCKED=new Set(["maintenance","dpe"]);
  const BOT=/bot|crawler|spider|slurp|fetch|preview/i, SKIP_HOST="svenboettger-supernal.github.io";
  const $=id=>document.getElementById(id);
  const money=n=>"$"+Math.round(Number(n)||0).toLocaleString("en-US");
  const when=t=>{ const d=new Date(t); return isNaN(d)?String(t):d.toLocaleString("en-US",{month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"}); };
  const linesOf=r=>{ const ids=((r.data||{}).lines)||[]; const o=ids.filter(i=>!LOCKED.has(i)).map(i=>LINES[i]||i); return o.length?o.join(", "):"Locked lines only"; };
  const evLabel=r=>{ const d=r.data||{}; if(r.event==="print") return "Print"; if(r.event==="select") return (d.on?"Ticked ":"Unticked ")+(LINES[d.line]||d.line||""); return "View"; };
  const td=(txt,cls)=>{ const c=document.createElement("td"); if(cls) c.className=cls; c.textContent=txt==null?"":String(txt); return c; };
  const row=(cells)=>{ const tr=document.createElement("tr"); for(const c of cells) tr.appendChild(c instanceof Node?c:td(c)); return tr; };
  const head=(tb,cols)=>{ tb.innerHTML=""; const tr=document.createElement("tr"); for(const [t,c] of cols){ const th=document.createElement("th"); if(c) th.className=c; th.textContent=t; tr.appendChild(th); } tb.appendChild(tr); };
  const empty=(tb,n,txt)=>{ const tr=document.createElement("tr"); const c=td(txt,"empty"); c.colSpan=n; tr.appendChild(c); tb.appendChild(tr); };
  let key=""; try{ key=localStorage.getItem("hs-key")||""; }catch(_){}
  let timer=null;
  function showKey(msg){ $("keybox").hidden=false; $("forget").hidden=true; const e=$("err"); e.hidden=!msg; e.textContent=msg||""; }
  async function load(){
    if(!key){ showKey(""); return; }
    const b=$("refresh"); b.disabled=true;
    try{
      const r=await fetch(URL_,{method:"POST",headers:{"apikey":KEY,"Authorization":"Bearer "+KEY,"Content-Type":"application/json"},body:JSON.stringify({p_key:key,p_artifact:ARTIFACT,p_limit:5000})});
      if(r.status===403){ key=""; try{ localStorage.removeItem("hs-key"); }catch(_){} showKey("That key was not accepted."); return; }
      if(!r.ok) throw new Error("HTTP "+r.status);
      let rows=await r.json();
      rows=rows.filter(x=>x.event!=="test"&&!BOT.test(x.user_agent||"")&&(x.host||"")!==SKIP_HOST).sort((a,b)=>String(b.created_at).localeCompare(String(a.created_at)));
      render(rows); $("keybox").hidden=true; $("forget").hidden=false;
      $("sub").textContent="Live from the event log. Loaded "+new Date().toLocaleTimeString("en-US",{hour:"2-digit",minute:"2-digit",second:"2-digit"})+(rows.length?", events from "+[...new Set(rows.map(x=>x.host).filter(Boolean))].join(", "):", nothing logged yet")+".";
    }catch(e){ $("sub").textContent="Could not load the event log ("+(e&&e.message||"error")+"). Check the connection and press Refresh."; }
    finally{ b.disabled=false; }
  }
  function render(rows){
    const views=rows.filter(r=>r.event==="view").length, prints=rows.filter(r=>r.event==="print"), selects=rows.filter(r=>r.event==="select").length;
    const sessions=new Map();
    for(const r of rows){ const sid=r.session_id||r.id; let s=sessions.get(sid); if(!s){ s={host:r.host||"",last:r.created_at,first:r.created_at,views:0,selects:0,prints:0,lastLines:linesOf(r),lastMonth:(r.data||{}).month}; sessions.set(sid,s); } s.first=r.created_at; s[r.event==="select"?"selects":r.event==="print"?"prints":"views"]++; }
    const kp=$("kpis"); kp.innerHTML="";
    for(const [k,v] of [["Views",views],["Proposals printed",prints.length],["Boxes toggled",selects],["Browsers",sessions.size],["Last activity",rows[0]?when(rows[0].created_at):"none yet"]]){ const d=document.createElement("div"); const a=document.createElement("span"); a.className="k"; a.textContent=k; const b=document.createElement("span"); b.className="v"; b.textContent=String(v); d.append(a,b); kp.appendChild(d); }
    const tp=$("prints"); head(tp,[["When"],["Reference"],["Lines ticked"],["Per month","r"],["People","r"],["Where"],["Browser"]]);
    if(!prints.length) empty(tp,7,"No proposal printed yet.");
    for(const r of prints) tp.appendChild(row([when(r.created_at),td(r.ref||"","mono"),linesOf(r),td(money((r.data||{}).month),"r"),td((r.data||{}).people,"r"),r.host||"",td((r.session_id||"").slice(0,6),"mono")]));
    const ts=$("sessions"); head(ts,[["Browser"],["Where"],["First seen"],["Last seen"],["Views","r"],["Toggles","r"],["Prints","r"],["Last selection"],["Per month","r"]]);
    if(!sessions.size) empty(ts,9,"No visits yet.");
    for(const [sid,s] of sessions) ts.appendChild(row([td(sid.slice(0,6),"mono"),s.host,when(s.first),when(s.last),td(s.views,"r"),td(s.selects,"r"),td(s.prints,"r"),s.lastLines,td(money(s.lastMonth),"r")]));
    const tl=$("log"); head(tl,[["When"],["Browser"],["Where"],["Event"],["Lines ticked"],["Per month","r"],["Reference"]]);
    if(!rows.length) empty(tl,7,"Nothing logged yet.");
    for(const r of rows.slice(0,300)){ const e=document.createElement("span"); e.className="ev "+r.event; e.textContent=evLabel(r); const c=document.createElement("td"); c.appendChild(e); tl.appendChild(row([when(r.created_at),td((r.session_id||"").slice(0,6),"mono"),r.host||"",c,linesOf(r),td(money((r.data||{}).month),"r"),td(r.ref||"","mono")])); }
  }
  function schedule(){ if(timer) clearInterval(timer); timer=null; if($("auto").checked) timer=setInterval(()=>{ if(!document.hidden) load(); },60000); }
  $("refresh").addEventListener("click",load);
  $("auto").addEventListener("change",schedule);
  $("save").addEventListener("click",()=>{ const v=$("key").value.trim(); if(!v) return; key=v; try{ localStorage.setItem("hs-key",v); }catch(_){} $("key").value=""; load(); });
  $("key").addEventListener("keydown",e=>{ if(e.key==="Enter") $("save").click(); });
  $("forget").addEventListener("click",()=>{ key=""; try{ localStorage.removeItem("hs-key"); }catch(_){} $("kpis").innerHTML=""; for(const id of ["prints","sessions","log"]) $(id).innerHTML=""; showKey(""); });
  document.addEventListener("visibilitychange",()=>{ if(!document.hidden&&key) load(); });
  load(); schedule();
})();
</script>
</body>
</html>
